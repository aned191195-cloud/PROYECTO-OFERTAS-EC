name: Recolectar ofertas

# Todos los días a las 07:00 de Ecuador (12:00 UTC; Ecuador no cambia de hora).
# GitHub puede retrasar unos minutos las tareas programadas.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write # para guardar el ofertas.json nuevo

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recolector/requirements.txt

      - name: Instalar dependencias
        run: pip install -r recolector/requirements.txt

      - name: Recolectar ofertas
        working-directory: recolector
        run: python recolectar.py

      - name: Guardar los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin cambios en las ofertas."
          else
            git commit -m "Ofertas del $(TZ=America/Guayaquil date +%Y-%m-%d)"
            git push
          fi
